[project]
name = "shipline"
version = "0"
description = "The tests of Shipline's workflow scripts; the scripts need only the standard library."
requires-python = ">=3.14"
dependencies = []

# The test tools, pinned with their hashes in requirements-test.txt.
[dependency-groups]
test = ["pytest==9.1.1", "pytest-timeout==2.4.0", "pytest-xdist==3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests/workflow", "tests/runner"]
pythonpath = ["tests"]
timeout = 120
# A passing test leaves no temporary files; the last two runs keep those of their failures.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 2
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "serial: cannot run beside other tests; CI runs these in one shard, one at a time",
]
