[project]
name = "shipline"
version = "0"
description = "The tests of Shipline's workflow scripts; the scripts need only the standard library."
requires-python = ">=3.14"
dependencies = []

# The test tools, pinned with their hashes in requirements-test.txt.
[dependency-groups]
test = ["pytest==9.1.1", "pytest-timeout==2.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests/workflow"]
pythonpath = ["tests"]
timeout = 120
addopts = ["--strict-config", "--strict-markers"]
