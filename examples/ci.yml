# The CI of a repository that uses Shipline, as `.github/workflows/ci.yml` (`workflows.ci` in
# shipline.json): a planner that writes the notes the merge gate reads, one job that runs the
# repository's own tests (`commands.test`), and the check that sums them up. The job names are
# the defaults of shipline.json's `checks`; a repository that names others names its jobs so.
#
# Every job runs on GitHub's own runners, the ordinary choice, except when the repository has a
# runner pool and turns main's runners on with the repository variable `CI_MAIN_RUNNER` set to
# `on`. Then a push to main runs on main's runners, `<runner.label>-main`. The merge gate's first
# run of a prefix, its dispatch on a scratch branch of its own (`merge.scratch_prefix`), runs in
# the merge line's lane on them, `<runner.label>-main-batch`, when its planner finds one of them
# free there, so a prefix never waits behind pull requests' own CI; else, and on any re-run,
# it takes the ordinary choice, so it never waits on main's runners either. Main's runners carry
# the lane only while no push to main waits (runner/lend_runners.py), so main keeps its place.
# The labels here are the defaults, `<runner.prefix>-home` with the runner prefix `example-app`;
# a repository with a pool puts its own choice where this says `ubuntu-latest`.
#
# The choice keeps every other run of this workflow, a pull request's among them, off main's
# runners, but not a branch's own copy of the workflow: a scratch run runs the merge line's
# members, and the workflow as they changed it, on main's machine, and any pushed branch may name
# main's label itself. GitHub reads the prefix without its case. Keep main's runners to the
# workflows and branches meant for them with a runner group, have outside contributors' runs
# approved before they start, and let only the gate's identity create branches of the prefix,
# in any case.
name: CI

on:
  # A draft runs no CI: its worker runs the tests in its own session. Marking it ready starts its
  # run on the current head.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge gate runs every suite on a scratch branch of its own with `gh workflow run`.
  workflow_dispatch:

# Read-only for every run; a pull request from a fork gets no secrets either, as GitHub gives
# `pull_request` runs of forks none.
permissions:
  contents: read

# A pull request's newer push cancels its older run. Every commit of main and every scratch run
# keeps its own: the merge gate reads each of them. A draft's runs, which run nothing, have a
# group of their own, so one queued after the ready run never cancels it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-draft-{1}', github.ref, github.event.pull_request.draft) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # The gate reads its notes from this job alone (`checks.ci_plan`).
    name: "CI: what to run"
    # Skipped while the pull request is a draft; the jobs after it are skipped by their own check.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # A push to main on main's runners; the planner of every other run on the ordinary choice.
    runs-on: >-
      ${{ vars.CI_MAIN_RUNNER == 'on' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && fromJSON('["self-hosted", "example-app-home-main"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      # On main, reading the runs a squash's proof names, with their jobs and notes.
      actions: read
      checks: read
    outputs:
      inherited: ${{ steps.inherited.outputs.inherited || '[]' }}
      main_lane: ${{ steps.lane.outputs.main_lane || 'false' }}
    steps:
      # On a pull request this is GitHub's merge of it into main: the merge the gate checks.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The notes the merge gate reads
        # Every run runs the whole suite; a repository that runs a selection notes it with
        # `--selected server_tests N M files`, and one that needs none with `--none`.
        run: python3 scripts/workflow/ci_proof.py notes --whole server_tests
      # The merge gate's first run of a prefix takes the merge line's lane on main's runners only
      # when the pool's lender notes one of them online and idle with it (`ci_proof.py
      # main-lane`). Only the pool's planner runner sees that note: elsewhere the lane is never
      # taken.
      - name: Whether the prefix takes main's lane
        id: lane
        if: >-
          vars.CI_MAIN_RUNNER == 'on' && github.event_name == 'workflow_dispatch'
          && github.run_attempt == '1' && startsWith(github.ref, 'refs/heads/workflow/merge-batch-')
        run: python3 scripts/workflow/ci_proof.py main-lane
      # A squash the gate made carries its proof: main skips a job that passed, whole, on the
      # identical tree, and names the run it inherited. Any other push runs everything.
      - name: The jobs main inherits from its squash's proof
        id: inherited
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/workflow/ci_proof.py inherited ci

  tests:
    # The gate's name for the job that runs every server test.
    name: "CI: server tests"
    needs: plan
    # Skipped while the pull request is a draft; no other run is filtered by that check.
    # Folded: the job's name holds a colon, which a plain YAML value may not.
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && !contains(fromJSON(needs.plan.outputs.inherited), 'CI: server tests') }}
    # A push to main on main's runners; the gate's first run of a prefix in the merge line's lane
    # when its planner found it free; every other run on the ordinary choice.
    runs-on: >-
      ${{ vars.CI_MAIN_RUNNER == 'on' && (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && fromJSON('["self-hosted", "example-app-home-main"]') || github.run_attempt == '1'
      && needs.plan.outputs.main_lane == 'true' && fromJSON('["self-hosted", "example-app-home-main-batch"]'))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Whatever the repository's tests need installed comes before this.
      - name: Tests
        run: python3 scripts/workflow/ci_proof.py test

  result:
    # The check the gate judges a run by (`checks.ci_result`): it passes only when every job
    # that ran passed, the planner among them.
    name: CI result
    # Skipped with the others on a draft: a skipped result is no pass to the merge gate.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [plan, tests]
    # A push to main on main's runners; the gate's first run of a prefix in the merge line's lane
    # when its planner found it free; every other run on the ordinary choice.
    runs-on: >-
      ${{ vars.CI_MAIN_RUNNER == 'on' && (github.event_name == 'push' && github.ref == 'refs/heads/main'
      && fromJSON('["self-hosted", "example-app-home-main"]') || github.run_attempt == '1'
      && needs.plan.outputs.main_lane == 'true' && fromJSON('["self-hosted", "example-app-home-main-batch"]'))
      || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a job ended: $result"; exit 1 ;;
            esac
          done
