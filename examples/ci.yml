# The CI of a repository that uses Shipline, as `.github/workflows/ci.yml` (`workflows.ci` in
# shipline.json): a planner that writes the notes the merge gate reads, one job that runs the
# repository's own tests (`commands.test`), and the check that sums them up. The job names are
# the defaults of shipline.json's `checks`; a repository that names others names its jobs so.
# Every job runs on GitHub's own runners.
# This example's unchanged repository selector, tools/ci-plan, prints JSON:
# {"needed": ["server_whole", "browser_whole", "images"],
#  "server_files": ["tests/test_example.py"], "server_total": 40}.
# `needed` comes from its existing path filters; server_files is its existing selection.
# The example command in commands.test accepts those filenames as arguments.
name: CI

on:
  # A draft runs no CI: its worker runs the tests in its own session. Marking it ready starts its
  # run on the current head.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge gate runs every suite on a scratch branch of its own with `gh workflow run`.
  workflow_dispatch:

# Read-only for every run; a pull request from a fork gets no secrets either, as GitHub gives
# `pull_request` runs of forks none.
permissions:
  contents: read

# A pull request's newer push cancels its older run. Every commit of main and every scratch run
# keeps its own: the merge gate reads each of them. A draft's runs, which run nothing, have a
# group of their own, so one queued after the ready run never cancels it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('{0}-draft-{1}', github.ref, github.event.pull_request.draft) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    # The gate reads its notes from this job alone (`checks.ci_plan`).
    name: "CI: what to run"
    # Skipped while the pull request is a draft; the jobs after it are skipped by their own check.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # On main, reading the runs a squash's proof names, with their jobs and notes.
      actions: read
      checks: read
    outputs:
      inherited: ${{ steps.inherited.outputs.inherited || '[]' }}
      prefix_only: ${{ steps.deferred.outputs.prefix_only || '[]' }}
      needed: ${{ steps.selection.outputs.needed }}
      server_files: ${{ steps.selection.outputs.server_files }}
    steps:
      # On a pull request this is GitHub's merge of it into main: the merge the gate checks.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: The repository's existing selection
        id: selection
        run: |
          tools/ci-plan > "$RUNNER_TEMP/selection.json"
          python3 - <<'PY'
          import json, os
          plan = json.load(open(os.environ['RUNNER_TEMP'] + '/selection.json'))
          assert isinstance(plan['needed'], list)
          assert all(group in ('images', 'server_whole', 'browser_whole') for group in plan['needed'])
          assert isinstance(plan['server_files'], list) and all(isinstance(p, str) for p in plan['server_files'])
          assert type(plan['server_total']) is int and plan['server_total'] >= len(plan['server_files'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for key in ('needed', 'server_files', 'server_total'):
                  print(key + '=' + json.dumps(plan[key]), file=out)
          PY
      - name: Defer only the configured groups this change needs
        id: deferred
        env:
          NEEDED: ${{ steps.selection.outputs.needed }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          args = [word for group in json.loads(os.environ['NEEDED']) for word in ('--needed', group)]
          subprocess.run(['python3', 'scripts/workflow/ci_proof.py', 'prefix-only', *args], check=True)
          PY
      - name: The notes the merge gate reads
        if: contains(fromJSON(steps.selection.outputs.needed), 'server_whole') && !contains(fromJSON(steps.deferred.outputs.prefix_only), 'server_whole')
        # Every run runs the whole suite; a repository that runs a selection notes it with
        # `--selected server_tests N M files`, and one that needs none with `--none`.
        run: python3 scripts/workflow/ci_proof.py notes --whole server_tests
      - name: Note the selected server tests
        if: contains(fromJSON(steps.deferred.outputs.prefix_only), 'server_whole')
        env:
          FILES: ${{ steps.selection.outputs.server_files }}
          TOTAL: ${{ steps.selection.outputs.server_total }}
        run: |
          ran=$(python3 -c 'import json, os; print(len(json.loads(os.environ["FILES"])))')
          python3 scripts/workflow/ci_proof.py notes --selected server_tests "$ran" "$TOTAL" files
      - name: Note that no server test is needed
        if: "!contains(fromJSON(steps.selection.outputs.needed), 'server_whole')"
        run: python3 scripts/workflow/ci_proof.py notes --none server_tests
      # A squash the gate made carries its proof: main skips a job that passed, whole, on the
      # identical tree, and names the run it inherited. Any other push runs everything.
      - name: The jobs main inherits from its squash's proof
        id: inherited
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/workflow/ci_proof.py inherited ci

  tests:
    # The gate's name for the job that runs every server test.
    name: "CI: server tests"
    needs: plan
    # Skipped while the pull request is a draft; no other run is filtered by that check.
    # Folded: the job's name holds a colon, which a plain YAML value may not.
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && contains(fromJSON(needs.plan.outputs.needed), 'server_whole')
      && !contains(fromJSON(needs.plan.outputs.prefix_only), 'server_whole')
      && !contains(fromJSON(needs.plan.outputs.inherited), 'CI: server tests') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Whatever the repository's tests need installed comes before this.
      - name: Tests
        run: python3 scripts/workflow/ci_proof.py test

  selected:
    name: "CI: selected server tests"
    needs: plan
    if: >-
      ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && contains(fromJSON(needs.plan.outputs.prefix_only), 'server_whole') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Only the existing selection
        env:
          FILES: ${{ needs.plan.outputs.server_files }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          files = json.loads(os.environ['FILES'])
          if files:
              subprocess.run(['python3', 'scripts/workflow/ci_proof.py', 'test', *files], check=True)
          PY

  fast:
    name: "CI: fast checks"
    needs: plan
    if: (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Lint, types, unit tests and dependency audit
        run: tools/fast-checks

  result:
    # The check the gate judges a run by (`checks.ci_result`): it passes only when every job
    # that ran passed, the planner among them.
    name: CI result
    # Skipped with the others on a draft: a skipped result is no pass to the merge gate.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    needs: [plan, tests, selected, fast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a job ended: $result"; exit 1 ;;
            esac
          done
