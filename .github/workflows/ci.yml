              tests/workflow/test_usage.py
              tests/workflow/test_workflow_metrics.py
          - shard: 8
            workers: 6
            # Projected test time 620.21s; 3721.25 measured worker-s.
            # tests/runner/test_balance_runners.py: 76.10s
            # tests/workflow/test_break_52.py: 295.52s
            # tests/workflow/test_break_55.py: 508.31s
            # tests/workflow/test_codex_worker.py: 1483.64s
            # tests/workflow/test_getting_started.py: 59.42s
            # tests/workflow/test_session_memory.py: 30.69s
            # tests/workflow/test_session_stop_and_cleanup.py: 10.08s
            # tests/workflow/test_test_run.py: 28.11s
            # tests/workflow/test_worker_routing.py: 1091.67s
            # tests/workflow/test_workflow_config.py: 137.71s
            files: >-
