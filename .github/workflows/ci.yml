          - shard: 7
            workers: 6
            # Projected test time 620.25s; 3721.50 measured worker-s.
            # tests/workflow/test_break_4_switch.py: 31.45s
            # tests/workflow/test_ci_proof.py: 29.10s
            # tests/workflow/test_independent_review.py: 892.13s
            # tests/workflow/test_input_box.py: 129.38s
            # tests/workflow/test_merge_driver_repairs.py: 1484.56s
            # tests/workflow/test_merge_github.py: 319.60s
            # tests/workflow/test_notify.py: 185.49s
            # tests/workflow/test_ticket_starts.py: 578.86s
            # tests/workflow/test_usage.py: 11.50s
            # tests/workflow/test_workflow_metrics.py: 59.43s
            files: >-
