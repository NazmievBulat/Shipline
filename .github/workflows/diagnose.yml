name: Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements-test.txt
      - name: What ps sees from inside pytest
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/look"
          cat > "$RUNNER_TEMP/look/test_look.py" <<'PY'
          import subprocess, sys
          def test_look():
              script = (
                  "ps aux > /tmp/ps-out 2> /tmp/ps-err; echo \"rc $?\"; wc -lc < /tmp/ps-out; head -3 /tmp/ps-out; "
                  "cat /tmp/ps-err; ps -eo pid,args | wc -l; ls /proc | head -5; ls /proc | wc -l; "
                  "grep -E 'Seccomp|NoNewPrivs|CapEff' /proc/self/status; cat /proc/self/mountinfo | grep ' /proc '"
              )
              for name, stdin in (("pipe", None), ("devnull", subprocess.DEVNULL)):
                  done = subprocess.run(["bash", "-c", script], capture_output=True, text=True, stdin=stdin)
                  print(name, repr(done.stdout), repr(done.stderr), file=sys.__stderr__)
          PY
          python -m pytest -p no:cacheprovider -p no:xdist -c /dev/null -q -s "$RUNNER_TEMP/look/test_look.py"
          python3 -c 'import subprocess; print("outside", subprocess.run(["bash", "-c", "ps aux | wc -lc"], capture_output=True, text=True).stdout)'
