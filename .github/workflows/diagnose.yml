name: Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements-test.txt
      - name: What ps sees from inside pytest
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/look"
          cat > "$RUNNER_TEMP/look/test_look.py" <<'PY'
          import os, shlex, subprocess, sys, time
          def test_look():
              command = "while ps aux | grep -q 'codex exec'; do sleep 0.2; done"
              shell = ["/bin/bash", "-c", f": codex exec && eval {shlex.quote(command)} < /dev/null"]
              started = subprocess.Popen(shell)
              time.sleep(1.5)
              print("loop still running:", started.poll() is None, file=sys.__stderr__)
              for name in ("COLUMNS", "LINES", "TERM", "PATH"):
                  print(name, os.environ.get(name), file=sys.__stderr__)
              print("ps:", subprocess.run(["sh", "-c", "command -v ps; ls -l /proc/self/fd/0 /proc/self/fd/1 /proc/self/fd/2"], capture_output=True, text=True).stdout, file=sys.__stderr__)
              listed = subprocess.run(["bash", "-c", "ps aux | grep 'codex exec'"], capture_output=True, text=True)
              print("ps aux | grep:", repr(listed.stdout), repr(listed.stderr), listed.returncode, file=sys.__stderr__)
              started.kill()
          PY
          python -m pytest -p no:cacheprovider -p no:xdist -c /dev/null -q -s "$RUNNER_TEMP/look/test_look.py"
          python -m pytest -p no:cacheprovider -p no:xdist -q -rA "tests/workflow/test_running_command.py::test_a_real_wait_loop_finds_its_own_shell_and_is_named" 2>&1 | tail -15
