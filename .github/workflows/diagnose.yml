name: Diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --require-hashes -r requirements-test.txt
      - name: What ps sees from inside pytest
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/look"
          cat > "$RUNNER_TEMP/look/look.sh" <<'SH'
          env | sort > "$1"
          bash -c ": a long command line that passes the eightieth column, then codex exec; sleep 5" &
          sleep 0.5
          echo "$1 widest: $(ps aux | awk '{ print length }' | sort -n | tail -1)"
          echo "$1 widest in a bare environment: $(env -i PATH="$PATH" ps aux | awk '{ print length }' | sort -n | tail -1)"
          kill %1
          SH
          cat > "$RUNNER_TEMP/look/test_look.py" <<'PY'
          import os, subprocess, sys
          def test_look():
              done = subprocess.run(["bash", os.environ["LOOK"], os.environ["RUNNER_TEMP"] + "/inside"], capture_output=True, text=True)
              print(done.stdout, done.stderr, file=sys.__stderr__)
          PY
          export LOOK="$RUNNER_TEMP/look/look.sh"
          python -m pytest -p no:cacheprovider -p no:xdist -c /dev/null -q -s "$RUNNER_TEMP/look/test_look.py"
          bash "$LOOK" "$RUNNER_TEMP/outside"
          diff "$RUNNER_TEMP/outside" "$RUNNER_TEMP/inside" | sed -E 's/=(.{40}).*/=\1.../'
